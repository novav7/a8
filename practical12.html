      <h2>Practical 2 : Basic Operations on NumPy Array</h2>

      <h2>• Perform arithmetic operations (addition, subtraction, multiplication, division) on a single array.</h2>
<textarea id="code1" rows="12" cols="80">
import numpy as np

# Create a NumPy array

arr = np.array([10, 20, 30, 40, 50])

print("Original Array:", arr)

# Arithmetic operations

print("Addition (+10):", arr + 10)

print("Subtraction (-5):", arr - 5)

print("Multiplication (*2):", arr * 2)

print("Division (/2):", arr / 2)
</textarea>
<button onclick="copyCode('code1', this)">Copy</button>

<br><br>
      <h2>• Demonstrate element-wise operations.</h2>
<textarea id="code2" rows="12" cols="80">
import numpy as np

# Create two NumPy arrays

arr1 = np.array([10, 20, 30, 40, 50])

arr2 = np.array([1, 2, 3, 4, 5])

print("Array 1:", arr1)

print("Array 2:", arr2)

# Element-wise operations

print("Element-wise Addition:", arr1 + arr2)

print("Element-wise Subtraction:", arr1 - arr2)

print("Element-wise Multiplication:", arr1 * arr2)

print("Element-wise Division:", arr1 / arr2)
</textarea>
<button onclick="copyCode('code2', this)">Copy</button>

<script>
function copyCode(id, btn) {
  let text = document.getElementById(id).value;

  navigator.clipboard.writeText(text);

  btn.innerText = "✅ Copied!";

  setTimeout(() => {
    btn.innerText = "📋 Copy";
  }, 2000);
}
</script>
