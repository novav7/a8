      <h3>Display dataset and statistical summary</h3>
<textarea id="code2" rows="26" cols="80">
import pandas as pd

# Load CSV file

df = pd.read_csv("students.csv")

# Display the dataset

print("Student Dataset:")

print(df)

# Display statistical summary

print("\nStatistical Summary:")

print(df.describe())

# Calculate mean

print("\nMean:")

print(df["Marks"].mean())

# Calculate median

print("\nMedian:")

print(df["Marks"].median())

# Calculate mode

print("\nMode:")

print(df["Marks"].mode()[0])

# Calculate minimum

print("\nMinimum:")

print(df["Marks"].min())

# Calculate maximum

print("\nMaximum:")

print(df["Marks"].max())

# Calculate standard deviation

print("\nStandard Deviation:")

print(df["Marks"].std())

# Calculate variance

print("\nVariance:")

print(df["Marks"].var())
</textarea>
<button onclick="copyCode('code2', this)">Copy</button>

<script>
function copyCode(id, btn) {
  let text = document.getElementById(id).value;

  navigator.clipboard.writeText(text);

  btn.innerText = "✅ Copied!";

  setTimeout(() => {
    btn.innerText = "📋 Copy";
  }, 2000);
}
</script>
