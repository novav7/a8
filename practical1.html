<h2> • Use formatted output statements</h2>
<textarea id="code2" rows="10" cols="80">
# Formatted Output Statements in Python

name = "Alice"

age = 20

marks = 89.5

pi = 3.14159265


print("Using f-strings:")

print(f"Name : {name}")

print(f"Age  : {age}")

print(f"Marks: {marks:.2f}")

print(f"Pi   : {pi:.3f}")


print("\nUsing format() method:")

print("Name : {}".format(name))

print("Age  : {}".format(age))

print("Marks: {:.2f}".format(marks))

print("Pi   : {:.3f}".format(pi))


print("\nUsing % formatting:")

print("Name : %s" % name)

print("Age  : %d" % age)

print("Marks: %.2f" % marks)

print("Pi   : %.3f" % pi)
</textarea>
<button onclick="copyCode('code2', this)">Copy</button>

<script>
function copyCode(id, btn) {
  let text = document.getElementById(id).value;

  navigator.clipboard.writeText(text);

  btn.innerText = "✅ Copied!";
  
  setTimeout(() => {
    btn.innerText = "📋 Copy";
  }, 2000);
}
</script>
