<!DOCTYPE html>
<html>
<head>
    <title>Practical Page</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            margin: 40px;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 700px;
        }

        h1 {
            margin-bottom: 20px;
        }

        img {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #3b82f6;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .back-btn:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>

    <div class="container">

      <h2>Practical 5 : Variable Handling</h2>
      <h2>• Write a program to swap two variables (with and without temporary variable).</h2>

      <h3>Program 5.1 — Swapping using a temporary variable</h3>
<textarea id="code1" rows="10" cols="80">
x = int(input("Enter value of x: "))
y = int(input("Enter value of y: "))
print(f"\nBefore swapping: x = {x}, y = {y}")
temp = x
x = y
y = temp
print(f"After swapping (using temp variable): x = {x}, y = {y}")
</textarea>
<button onclick="copyCode('code1', this)">Copy</button>

<br><br>
      <h3>Program 5.2 — Swapping WITHOUT a temporary variable</h3>
<textarea id="code2" rows="10" cols="80">
x = int(input("Enter value of x: "))
y = int(input("Enter value of y: "))
print(f"\nBefore swapping: x = {x}, y = {y}")
# --- Method A: Arithmetic operators ---
x = x + y
y = x - y
x = x - y
print(f"After swapping (arithmetic method): x = {x}, y = {y}")
</textarea>
<button onclick="copyCode('code2', this)">Copy</button>

<script>
function copyCode(id, btn) {
  let text = document.getElementById(id).value;

  navigator.clipboard.writeText(text);

  btn.innerText = "✅ Copied!";

  setTimeout(() => {
    btn.innerText = "📋 Copy";
  }, 2000);
}
</script>
     <br><br>
          <a href="index.html" class="back-btn">⬅ Back to Home</a>
    </div>

</body>
</html>
