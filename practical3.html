      <h2>  Practical 3 : Mathematical Functions  </h2>
      <h2>• Write a program to calculate the square root of a number. </h2>

<textarea id="code1" rows="10" cols="80">
import math

num = float(input("Enter a number: "))

if num >= 0:
    square_root = math.sqrt(num)
    print("Square root of", num, "is", square_root)
else:
    print("Square root of a negative number is not possible.")
</textarea>
<button onclick="copyCode('code1', this)">Copy</button>

<br><br>
<h2> • Explore use of the math module. .</h2>
<textarea id="code2" rows="10" cols="80">
import math

num = float(input("Enter a number: "))

print("Square Root:", math.sqrt(num))
print("Power (Square):", math.pow(num, 2))
print("Ceiling Value:", math.ceil(num))
print("Floor Value:", math.floor(num))
print("Factorial of 5:", math.factorial(5))
print("Value of Pi:", math.pi)
print("Value of e:", math.e)
print("Sine of 30°:", math.sin(math.radians(30)))
print("Cosine of 60°:", math.cos(math.radians(60)))
print("Logarithm (base e):", math.log(num))
</textarea>
<button onclick="copyCode('code2', this)">Copy</button>

<script>
function copyCode(id, btn) {
  let text = document.getElementById(id).value;

  navigator.clipboard.writeText(text);

  btn.innerText = "✅ Copied!";
  
  setTimeout(() => {
    btn.innerText = "📋 Copy";
  }, 2000);
}
</script>
