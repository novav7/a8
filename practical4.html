<!DOCTYPE html>
<html>
<head>
    <title>Practical Page</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            margin: 40px;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 700px;
        }

        h1 {
            margin-bottom: 20px;
        }

        img {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #3b82f6;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .back-btn:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>

    <div class="container">

      <h2>Practical 4 : Conditional Logic & Formula Implementation</h2>

      <h2>• Write a program to calculate the area of a triangle.</h2>
<textarea id="code1" rows="10" cols="80">
base = float(input("Enter the base: "))
height = float(input("Enter the height: "))

area = (base * height) / 2

print("Area of Triangle =", area)
</textarea>
<button onclick="copyCode('code1', this)">Copy</button>

<br><br>
      <h2>• Validate input values.</h2>
      <h3>Example 1</h3>
<textarea id="code2" rows="10" cols="80">
base = float(input("Enter the base: "))
height = float(input("Enter the height: "))

if base > 0 and height > 0:
    print("Valid Input")
else:
    print("Invalid Input! Base and Height must be greater than 0.")
</textarea>
<button onclick="copyCode('code2', this)">Copy</button>

<br><br>
      <h3>Example 2</h3>
<textarea id="code3" rows="10" cols="80">
base = float(input("Enter the base: "))
height = float(input("Enter the height: "))

if base > 0 and height > 0:
    print("Valid Input")
else:
    print("Invalid Input! Base and Height must be greater than 0.")
</textarea>
<button onclick="copyCode('code3', this)">Copy</button>

<script>
function copyCode(id, btn) {
  let text = document.getElementById(id).value;

  navigator.clipboard.writeText(text);

  btn.innerText = "✅ Copied!";

  setTimeout(() => {
    btn.innerText = "📋 Copy";
  }, 2000);
}
</script>

    </div>

</body>
