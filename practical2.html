<!DOCTYPE html>
<html>
<head>
    <title>Practical Page</title>
    <style>
        body {
            font-family: Arial;
            background: #f5f5f5;
            margin: 40px;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 700px;
        }

        h1 {
            margin-bottom: 20px;
        }

        img {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #3b82f6;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .back-btn:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>

    <div class="container">

      <h2> Practical 2 : Basic Arithmetic Operations   </h2>
      <h2>• Write a program to perform addition of two numbers. </h2>

<textarea id="code1" rows="10" cols="80">
num1 = float(input("Enter first number: "))
num2 = float(input("Enter second number: "))

addition = num1 + num2
subtraction = num1 - num2
multiplication = num1 * num2
division = num1 / num2

print("\nArithmetic Operations:")
print("Addition =", addition)
print("Subtraction =", subtraction)
print("Multiplication =", multiplication)
print("Division =", division)
</textarea>
<button onclick="copyCode('code1', this)">Copy</button>

<br><br>
<h2>• Perform subtraction, multiplication, and division.  .</h2>
<textarea id="code2" rows="10" cols="80">
num1 = 20
num2 = 5

print(f"Subtraction = {num1 - num2}")
print(f"Multiplication = {num1 * num2}")
print(f"Division = {num1 / num2}")
</textarea>
<button onclick="copyCode('code2', this)">Copy</button>

<script>
function copyCode(id, btn) {
  let text = document.getElementById(id).value;

  navigator.clipboard.writeText(text);

  btn.innerText = "✅ Copied!";
  
  setTimeout(() => {
    btn.innerText = "📋 Copy";
  }, 2000);
}
</script>
     <br> <br>
          <a href="index.html" class="back-btn">⬅ Back to Home</a>
    </div>

</body>
</html>
