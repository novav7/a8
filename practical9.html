      <h3>PRACTICAL 9.1 Store and search text in a variable.</h3>

<textarea id="code1" rows="10" cols="80">
text = "Python is a simple and powerful programming language."

      <h3>Program 9.2: Retrieve Data from an HTML File</h3>
      <h4>Step 1 — Create a file named sample.html</h4>
<textarea id="code2" rows="10" cols="80">
<html>
<head>
<title>My Web Page</title>
</head>

<body>
<h1>Welcome to Python</h1>
<p>This is HTML File.</p>
</body>

</html>
</textarea>
<button onclick="copyCode('code2', this)">Copy</button>

<br><br>
      <h4>Step 2 — Python Program</h4>
<textarea id="code3" rows="10" cols="80">
from bs4 import BeautifulSoup

with open("sample.html", "r") as file:

        html_content = file.read()

soup = BeautifulSoup(html_content, "html.parser")
title = soup.title.string

heading = soup.h1.text

print("Title:", title)
print("Heading:", heading)
</textarea>
<button onclick="copyCode('code3', this)">Copy</button>

<script>
function copyCode(id, btn) {
  let text = document.getElementById(id).value;

  navigator.clipboard.writeText(text);

  btn.innerText = "✅ Copied!";

  setTimeout(() => {
    btn.innerText = "📋 Copy";
  }, 2000);
}
</script>
