      <h2>Practical 2.5 : Filtering and Maximum Value Extraction</h2>

      <h2>• Create a NumPy array.</h2>
      <h2>• Apply filtering techniques.</h2>
      <h2>• Return maximum values from the array using conditional filtering.</h2>

<textarea id="code1" rows="14" cols="80">
import numpy as np
# Create a NumPy array
arr = np.array([10, 25, 15, 40, 30, 50, 20])
print("Original Array:")
print(arr)
# Filtering values greater than 25
filtered = arr[arr > 25]
print("Values greater than 25:")
print(filtered)
# Find maximum value from the filtered array
max_value = np.max(filtered)
print("Maximum value from filtered array:")
print(max_value)
</textarea>
<button onclick="copyCode('code1', this)">Copy</button>

<script>
function copyCode(id, btn) {
  let text = document.getElementById(id).value;

  navigator.clipboard.writeText(text);

  btn.innerText = "✅ Copied!";

  setTimeout(() => {
    btn.innerText = "📋 Copy";
  }, 2000);
}
</script>
