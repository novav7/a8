      <h2>Practical 4 : Sorting and Searching in Arrays</h2>

      <h2>• Write a program to sort an array alphabetically.</h2>

      <h3># Program to sort an array alphabetically</h3>
<textarea id="code1" rows="10" cols="80">
# Program to sort an array alphabetically

fruits = ["Mango", "Apple", "Banana", "Orange", "Grapes"]

print("Original array:", fruits)

fruits.sort()

print("Alphabetically sorted array:", fruits)

# In descending order

fruits.sort(reverse=True)

print(fruits)
</textarea>
<button onclick="copyCode('code1', this)">Copy</button>

<br><br>
      <h2>• Demonstrate sorting of numeric arrays</h2>

<script>
function copyCode(id, btn) {
  let text = document.getElementById(id).value;

  navigator.clipboard.writeText(text);

  btn.innerText = "✅ Copied!";

  setTimeout(() => {
    btn.innerText = "📋 Copy";
  }, 2000);
}
</script>
