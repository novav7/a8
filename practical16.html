      <h2>• Create a DataFrame object using lists and dictionaries</h2>
      <h3>Using list</h3>
<textarea id="code3" rows="8" cols="80">
names = ["Amit", "Priya", "Rahul", "Sneha"]
df1 = pd.DataFrame(names, columns=["Name"])
print("DataFrame using List:", df1)
print(df1)
</textarea>
<button onclick="copyCode('code3', this)">Copy</button>

<br><br>
      <h3>Using dictionary</h3>
<textarea id="code4" rows="12" cols="80">
# Creating DataFrame using a dictionary
data = {
    "Name": ["Amit", "Priya", "Rahul", "Sneha"],
    "Age": [20, 21, 19, 22],
    "Marks": [85, 90, 78, 88]
}
df2 = pd.DataFrame(data)
print("\nDataFrame using Dictionary:")
print(df2)
</textarea>
<button onclick="copyCode('code4', this)">Copy</button>

<script>
function copyCode(id, btn) {
  let text = document.getElementById(id).value;

  navigator.clipboard.writeText(text);

  btn.innerText = "✅ Copied!";

  setTimeout(() => {
    btn.innerText = "📋 Copy";
  }, 2000);
}
</script>
